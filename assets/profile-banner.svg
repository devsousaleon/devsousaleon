<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Leonardo de Sousa — software and game development</title>
  <desc id="desc">A dark blue banner with a code window, a game controller, and the initials LS.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#20213d"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#7aa2f7"/><stop offset="1" stop-color="#bb9af7"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7aa2f7" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#background)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <circle cx="1150" cy="-55" r="240" fill="#bb9af7" opacity=".05"/>
  <circle cx="700" cy="380" r="180" fill="#7aa2f7" opacity=".05"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="48" y="46" width="66" height="66" rx="18" fill="url(#accent)"/>
    <text x="81" y="88" text-anchor="middle" font-weight="700" font-size="27" fill="#111827">LS</text>
    <text x="134" y="73" fill="#a9b1d6" font-size="15" letter-spacing="3">SOFTWARE &amp; GAME DEVELOPMENT</text>
    <text x="134" y="99" fill="#7aa2f7" font-size="16">@devsousaleon</text>
    <text x="48" y="174" fill="#eef0ff" font-size="46" font-weight="700">Leonardo de Sousa</text>
    <text x="50" y="211" fill="#c0caf5" font-size="21">Ideas into software. Curiosity into games.</text>
    <g font-size="14" font-weight="600" text-anchor="middle">
      <rect x="48" y="244" width="70" height="32" rx="9" fill="#7aa2f7" fill-opacity=".12" stroke="#7aa2f7" stroke-opacity=".35"/>
      <text x="83" y="265" fill="#7aa2f7">C#</text>
      <rect x="130" y="244" width="84" height="32" rx="9" fill="#bb9af7" fill-opacity=".12" stroke="#bb9af7" stroke-opacity=".35"/>
      <text x="172" y="265" fill="#bb9af7">.NET</text>
      <rect x="226" y="244" width="88" height="32" rx="9" fill="#9ece6a" fill-opacity=".12" stroke="#9ece6a" stroke-opacity=".35"/>
      <text x="270" y="265" fill="#9ece6a">Unity</text>
      <rect x="326" y="244" width="76" height="32" rx="9" fill="#e0af68" fill-opacity=".12" stroke="#e0af68" stroke-opacity=".35"/>
      <text x="364" y="265" fill="#e0af68">SQL</text>
    </g>
  </g>
  <g transform="translate(777 52)">
    <rect width="355" height="192" rx="16" fill="#111827" stroke="#3b4261"/>
    <path d="M0 37H355" stroke="#3b4261"/>
    <circle cx="20" cy="19" r="4" fill="#f7768e"/><circle cx="35" cy="19" r="4" fill="#e0af68"/><circle cx="50" cy="19" r="4" fill="#9ece6a"/>
    <g font-family="Consolas, monospace" font-size="16">
      <text x="24" y="72" fill="#bb9af7">while (curious)</text>
      <text x="24" y="98" fill="#a9b1d6">{</text>
      <text x="46" y="124" fill="#7aa2f7">learn();</text>
      <text x="46" y="150" fill="#9ece6a">build();</text>
      <text x="24" y="176" fill="#a9b1d6">}</text>
    </g>
    <g transform="translate(208 141)">
      <path d="M25 0H90C109 0 118 17 124 40L131 66C137 86 119 93 107 77L92 58H23L9 77C-3 93-21 86-15 66L-8 40C-2 17 7 0 25 0Z" fill="#24283b" stroke="#7aa2f7" stroke-width="3"/>
      <path d="M24 23V45M13 34H35" stroke="#c0caf5" stroke-width="5" stroke-linecap="round"/>
      <circle cx="86" cy="25" r="5" fill="#bb9af7"/><circle cx="101" cy="39" r="5" fill="#9ece6a"/>
      <path d="M49 43H58M64 43H73" stroke="#565f89" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
</svg>
