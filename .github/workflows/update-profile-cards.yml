name: Update profile cards

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
  push:
    branches: [main, master]
    paths:
      - scripts/generate-profile-cards.mjs
      - .github/workflows/update-profile-cards.yml

permissions:
  contents: write

concurrency:
  group: profile-cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'devsousaleon/devsousaleon'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Generate SVG cards from public GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: node scripts/generate-profile-cards.mjs

      - name: Commit updated cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-stats.svg assets/top-languages.svg
          if git diff --cached --quiet; then
            echo 'The cards are already up to date.'
            exit 0
          fi
          git commit -m 'docs: update profile cards'
          git push
